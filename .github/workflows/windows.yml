name: Windows build and release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 25
    defaults:
      run:
        shell: pwsh
        working-directory: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
          skip-lts-prepass: true
        env:
          DOTNET_INSTALL_DIR: ${{ github.workspace }}\.tools\dotnet
      - name: Restore locked packages
        run: ./scripts/restore.ps1
      - name: Test
        run: ./scripts/test.ps1
      - name: Package portable Windows app
        run: |
          ./scripts/package.ps1
          ./tests/package-tests.ps1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Proctal.Windows
          path: |
            dist/Proctal.Windows.zip
            dist/Proctal.Windows.sha256
          if-no-files-found: error
          retention-days: 14

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: windows
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: Proctal.Windows
          path: release
      - name: Publish Windows download
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PROCTAL_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$PROCTAL_TAG" >/dev/null 2>&1; then
            gh release upload "$PROCTAL_TAG" release/Proctal.Windows.zip release/Proctal.Windows.sha256 --clobber
          else
            gh release create "$PROCTAL_TAG" release/Proctal.Windows.zip release/Proctal.Windows.sha256 --verify-tag --title "Proctal $PROCTAL_TAG" --generate-notes
          fi
